[package]
name = "jules_shell"
version = "1.0.0"
edition = "2021"
description = "Jules OS - The Immutable, High-Performance Shell & Init System"
authors = ["JulesOS Team"]
license = "MIT"

# We only need pure-Rust or well-maintained system crates.
# No heavy dependencies - keep the binary small and fast.
[dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs", "hostname"] }
signal-hook = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3          # Maximum optimization (-O3 equivalent)
lto = true             # Link-Time Optimization → smaller + faster binary
strip = true           # Strip debug symbols → smaller binary
panic = "abort"        # No unwinding → smaller binary, no overhead
codegen-units = 1      # Single codegen unit → better cross-module optimization

[profile.dev]
opt-level = 1          # Some optimization even in debug for testing
