name: Jules OS Build, Test & ISO Generation

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build Jules Shell (C++) ──────────────────────────
  build:
    name: Build Jules Shell
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            g++ \
            make \
            wget \
            tar \
            cpio \
            gzip \
            xorriso \
            syslinux \
            syslinux-utils

      - name: 🏗️ Build Jules Shell (CMake)
        working-directory: ./jules-os
        run: |
          mkdir -p build
          cd build
          cmake -DSTATIC_BUILD=ON ..
          make -j$(nproc)
          echo "[OK] Jules Shell compiled successfully"
          file ./jules_shell
          ls -lh ./jules_shell

      - name: 📦 Upload Jules Shell Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jules-shell-binary
          path: jules-os/build/jules_shell
          retention-days: 30

  # ── Run Unit & Component Tests ────────────────────────
  test:
    name: Unit & Component Tests
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            g++ \
            make

      - name: 📥 Download Jules Shell
        uses: actions/download-artifact@v4
        with:
          name: jules-shell-binary
          path: ./jules-os/build/

      - name: 🧪 Run Shell Tests
        working-directory: ./jules-os
        run: |
          chmod +x build/jules_shell
          echo "[TEST] Testing help command..."
          ./build/jules_shell -c "help" > /dev/null && echo "✅ PASS" || echo "❌ FAIL"
          
          echo "[TEST] Testing clear command..."
          ./build/jules_shell -c "clear" > /dev/null && echo "✅ PASS" || echo "❌ FAIL"
          
          echo "[TEST] Testing fetch command..."
          ./build/jules_shell -c "fetch" > /dev/null && echo "✅ PASS" || echo "❌ FAIL"
          
          echo "[TEST] Testing empty command..."
          OUTPUT=$(./build/julius_shell -c "" 2>&1)
          if [ -z "$OUTPUT" ]; then
            echo "✅ PASS - Empty command handled correctly"
          else
            echo "❌ FAIL - Empty command produced output"
            exit 1
          fi

      - name: 🔍 Test Build Script Syntax
        run: |
          echo "[TEST] Validating build.sh syntax..."
          bash -n julius-os/scripts/build.sh && echo "✅ build.sh syntax valid" || exit 1
          
          echo "[TEST] Validating init.sh syntax..."
          sh -n julius-os/scripts/init.sh && echo "✅ init.sh syntax valid" || exit 1
          
          echo "[TEST] Validating boot.sh syntax..."
          bash -n julius-os/scripts/boot.sh && echo "✅ boot.sh syntax valid" || exit 1

  # ── Build ISO Image ──────────────────────────────────
  iso:
    name: Build ISO Image
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install ISO Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            g++ \
            make \
            wget \
            tar \
            cpio \
            gzip \
            xorriso \
            syslinux \
            syslinux-utils \
            dosfstools \
            mtools \
            qemu-utils

      - name: 📥 Download Jules Shell
        uses: actions/download-artifact@v4
        with:
          name: jules-shell-binary
          path: ./julius-os/build/

      - name: 🏗️ Build ISO Image
        working-directory: ./julius-os
        run: |
          chmod +x build/julius_shell
          chmod +x scripts/build.sh
          chmod +x scripts/boot.sh
          chmod +x scripts/init.sh
          
          echo "================================"
          echo "Building Jules OS ISO..."
          echo "================================"
          
          bash scripts/build.sh
          
          if [ -f JulesOS.iso ]; then
            echo "[OK] ISO created successfully!"
            ls -lh JulesOS.iso
            file JulesOS.iso
          else
            echo "[ERROR] ISO creation failed!"
            exit 1
          fi

      - name: 📊 Verify ISO Structure
        working-directory: ./julius-os
        run: |
          echo "================================"
          echo "ISO Contents:"
          echo "================================"
          
          if [ -d iso/boot ]; then
            echo "[OK] Boot directory exists"
            ls -lh iso/boot/
            [ -f iso/boot/bzImage ] && echo "[OK] Kernel (bzImage) found" || echo "[WARN] Kernel not found"
            [ -f iso/boot/initrd.img ] && echo "[OK] Initrd found" || echo "[WARN] Initrd not found"
          fi

      - name: 📦 Upload ISO Artifact
        id: upload-iso
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: julesOS-iso
          path: julius-os/JulesOS.iso
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Fallback: Upload to Release
        if: steps.upload-iso.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: auto-build-${{ github.sha }}
          files: julius-os/JulesOS.iso
          name: "Auto Build: ${{ github.sha }}"
          body: "Automatic build from commit ${{ github.sha }}"

  # ── Security Scan ────────────────────────────────────
  security:
    name: Security Analysis
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Security Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cppcheck \
            flawfinder \
            shellcheck

      - name: 🔍 C++ Static Analysis (cppcheck)
        working-directory: ./julius-os
        run: |
          echo "=== Running cppcheck ==="
          cppcheck --enable=all --inconclusive --std=c++17 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I./include src/ 2>&1 | tee cppcheck.log || true
          
          ISSUES=$(grep -c "error\|warning\|style" cppcheck.log || echo 0)
          echo "[INFO] Found $ISSUES issues (excluding suppressions)"

      - name: 🐛 Security Scan (flawfinder)
        working-directory: ./julius-os
        run: |
          echo "=== Running flawfinder ==="
          flawfinder --minlevel=1 --columns src/ 2>&1 | tee flawfinder.log || true

      - name: 🔒 Shell Script Analysis (shellcheck)
        run: |
          echo "=== Running shellcheck ==="
          shellcheck -x julius-os/scripts/*.sh || true

      - name: 📊 Security Summary
        working-directory: ./julius-os
        run: |
          echo "================================"
          echo "Security Scan Summary"
          echo "================================"
          echo ""
          echo "cppcheck issues: $(grep -c 'error\|warning\|style' cppcheck.log || echo 0)"
          echo "flawfinder issues: $(grep -c '\[.*\]' flawfinder.log || echo 0)"
          echo ""
          echo "[INFO] Review detailed logs in artifacts"

      - name: 📦 Upload Security Logs
        id: upload-security
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            julius-os/cppcheck.log
            julius-os/flawfinder.log
          retention-days: 7

  # ── Summary & Status ─────────────────────────────────
  summary:
    name: Build Summary
    needs: [ build, test, iso, security ]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📊 Workflow Status
        run: |
          echo "════════════════════════════════════"
          echo "   Jules OS Build & Test Summary"
          echo "════════════════════════════════════"
          echo ""
          echo "Build Status:     ${{ needs.build.result }}"
          echo "Test Status:      ${{ needs.test.result }}"
          echo "ISO Build Status: ${{ needs.iso.result }}"
          echo "Security Status:  ${{ needs.security.result }}"
          echo ""
          if [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.iso.result }}" = "success" ]; then
            echo "✅ All critical jobs PASSED"
          else
            echo "❌ Some jobs FAILED - review logs above"
          fi
          echo ""
