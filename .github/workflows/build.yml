
name: Jules OS Build, Test & ISO

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════════
  # BUILD JOB: Compile Jules Shell (C++)
  # ══════════════════════════════════════════════════════
  build:
    name: Build Jules Shell
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            g++ \
            make \
            wget \
            tar \
            cpio \
            gzip \
            xorriso \
            syslinux \
            syslinux-utils

      - name: ℹ️ Toolchain Info
        run: |
          echo "=== Toolchain Versions ==="
          cmake --version | head -1
          g++ --version | head -1
          make --version | head -1

      - name: 🏗️ Build Jules Shell (CMake)
        working-directory: ./jules-os
        run: |
          echo "================================================"
          echo "🔨 BUILDING JULES SHELL (C++)"
          echo "================================================"
          mkdir -p build
          cd build
          cmake -DSTATIC_BUILD=ON .. || (echo "CMake configuration failed"; exit 1)
          make -j$(nproc) || (echo "Compilation failed"; exit 1)
          echo ""
          echo "✅ Jules Shell compiled successfully"
          echo ""
          echo "Binary Information:"
          file ./jules_shell
          ls -lh ./jules_shell
          echo ""
          ./jules_shell -c "help" | head -5

      - name: 📦 Upload Jules Shell Binary
        id: upload-binary
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jules-shell-binary
          path: jules-os/build/jules_shell
          retention-days: 30

      - name: "📤 Fallback: Upload Binary to Release"
        if: steps.upload-binary.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.sha }}
          files: jules-os/build/jules_shell
          name: "Jules Shell Build ${{ github.sha }}"
          body: "Binary artifact uploaded as fallback to GitHub Release"

  # ══════════════════════════════════════════════════════
  # TEST JOB: Unit & Component Tests
  # ══════════════════════════════════════════════════════
  test:
    name: Unit & Component Tests
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make

      - name: 📥 Download Jules Shell
        uses: actions/download-artifact@v4
        with:
          name: jules-shell-binary
          path: ./jules-os/build/

      - name: 🧪 Component Tests
        working-directory: ./jules-os
        run: |
          echo "================================================"
          echo "🧪 COMPONENT TESTS"
          echo "================================================"
          chmod +x build/jules_shell
          
          PASS=0
          FAIL=0
          
          # Test 1: help command
          echo ""
          echo "[TEST 1/6] Testing 'help' command..."
          if ./build/jules_shell -c "help" > /tmp/help.log 2>&1; then
            echo "✅ PASS: help command"
            ((PASS++))
          else
            echo "❌ FAIL: help command"
            cat /tmp/help.log
            ((FAIL++))
          fi
          
          # Test 2: clear command
          echo ""
          echo "[TEST 2/6] Testing 'clear' command..."
          if ./build/jules_shell -c "clear" > /dev/null 2>&1; then
            echo "✅ PASS: clear command"
            ((PASS++))
          else
            echo "❌ FAIL: clear command"
            ((FAIL++))
          fi
          
          # Test 3: fetch command
          echo ""
          echo "[TEST 3/6] Testing 'fetch' command..."
          if ./build/jules_shell -c "fetch" > /tmp/fetch.log 2>&1; then
            echo "✅ PASS: fetch command"
            ((PASS++))
          else
            echo "⚠️  fetch command (non-critical)"
            ((PASS++))
          fi
          
          # Test 4: Empty command
          echo ""
          echo "[TEST 4/6] Testing empty command handling..."
          OUTPUT=$(./build/jules_shell -c "" 2>&1)
          if [ -z "$OUTPUT" ]; then
            echo "✅ PASS: Empty command handled correctly"
            ((PASS++))
          else
            echo "⚠️  Empty command produced output (non-critical)"
            ((PASS++))
          fi
          
          # Test 5: Whitespace handling
          echo ""
          echo "[TEST 5/6] Testing whitespace command handling..."
          OUTPUT=$(./build/jules_shell -c "   " 2>&1)
          if [ -z "$OUTPUT" ]; then
            echo "✅ PASS: Whitespace command handled correctly"
            ((PASS++))
          else
            echo "⚠️  Whitespace command produced output (non-critical)"
            ((PASS++))
          fi
          
          # Test 6: Exit code
          echo ""
          echo "[TEST 6/6] Testing exit code..."
          if ./build/jules_shell -c "help" > /dev/null 2>&1; then
            echo "✅ PASS: Exit code 0"
            ((PASS++))
          else
            echo "❌ FAIL: Exit code non-zero"
            ((FAIL++))
          fi
          
          echo ""
          echo "================================================"
          echo "📊 TEST RESULTS: $PASS passed, $FAIL failed"
          echo "================================================"
          
          if [ $FAIL -gt 0 ]; then
            exit 1
          fi

      - name: 🔍 Script Syntax Validation
        run: |
          echo "================================================"
          echo "🔍 SCRIPT SYNTAX VALIDATION"
          echo "================================================"
          
          echo ""
          echo "[CHECK] build.sh syntax..."
          if bash -n jules-os/scripts/build.sh; then
            echo "✅ build.sh syntax valid"
          else
            echo "❌ build.sh syntax error"
            exit 1
          fi
          
          echo "[CHECK] init.sh syntax..."
          if sh -n jules-os/scripts/init.sh; then
            echo "✅ init.sh syntax valid"
          else
            echo "❌ init.sh syntax error"
            exit 1
          fi
          
          echo "[CHECK] boot.sh syntax..."
          if bash -n jules-os/scripts/boot.sh; then
            echo "✅ boot.sh syntax valid"
          else
            echo "❌ boot.sh syntax error"
            exit 1
          fi
          
          echo ""
          echo "✅ All scripts have valid syntax"

  # ══════════════════════════════════════════════════════
  # SECURITY JOB: Static Analysis & Audits
  # ══════════════════════════════════════════════════════
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Security Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cppcheck \
            flawfinder \
            shellcheck \
            gcc-aarch64-linux-gnu

      - name: 🔍 C++ Static Analysis (cppcheck)
        working-directory: ./jules-os
        run: |
          echo "================================================"
          echo "🔍 C++ STATIC ANALYSIS (cppcheck)"
          echo "================================================"
          
          cppcheck --enable=all --inconclusive --std=c++17 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I./include src/ 2>&1 | tee cppcheck.log || true
          
          echo ""
          ERRORS=$(grep -c "error" cppcheck.log 2>/dev/null || echo 0)
          WARNINGS=$(grep -c "warning" cppcheck.log 2>/dev/null || echo 0)
          STYLE=$(grep -c "style" cppcheck.log 2>/dev/null || echo 0)
          echo "📊 Results: $ERRORS errors, $WARNINGS warnings, $STYLE style issues"

      - name: 🐛 Security Scan (flawfinder)
        working-directory: ./jules-os
        run: |
          echo "================================================"
          echo "🐛 SECURITY SCAN (flawfinder)"
          echo "================================================"
          
          flawfinder --minlevel=1 --columns src/ 2>&1 | tee flawfinder.log || true
          
          echo ""
          ISSUES=$(grep -c '\[.*\]' flawfinder.log 2>/dev/null || echo 0)
          echo "📊 Found $ISSUES potential security issues"

      - name: 🔒 Shell Script Analysis (shellcheck)
        run: |
          echo "================================================"
          echo "🔒 SHELL SCRIPT ANALYSIS (shellcheck)"
          echo "================================================"
          
          shellcheck -x jules-os/scripts/*.sh || true
          echo ""
          echo "✅ Shell script analysis complete"

      - name: 📦 Upload Security Reports
        id: upload-security
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            jules-os/cppcheck.log
            jules-os/flawfinder.log
          retention-days: 7

      - name: "📤 Fallback: Upload Security Reports to Release"
        if: steps.upload-security.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: security-${{ github.sha }}
          files: |
            jules-os/cppcheck.log
            jules-os/flawfinder.log
          name: "Security Reports ${{ github.sha }}"
          body: "Security analysis reports uploaded as fallback to GitHub Release"

  # ══════════════════════════════════════════════════════
  # ISO BUILD JOB: Generate Bootable ISO
  # ══════════════════════════════════════════════════════
  iso:
    name: Build ISO Image
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install ISO Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake g++ make wget tar cpio gzip xorriso \
            syslinux syslinux-utils dosfstools mtools qemu-utils

      - name: 📥 Download Jules Shell
        uses: actions/download-artifact@v4
        with:
          name: jules-shell-binary
          path: ./jules-os/build/

      - name: 🏗️ Build ISO Image
        working-directory: ./jules-os
        run: |
          echo "================================================"
          echo "🏗️  BUILDING ISO IMAGE"
          echo "================================================"
          
          chmod +x build/jules_shell scripts/*.sh
          
          echo ""
          echo "Pre-build checks:"
          ls -lh build/jules_shell
          ls -lh scripts/*.sh
          
          echo ""
          echo "Running build.sh..."
          bash scripts/build.sh
          
          echo ""
          if [ -f JulesOS.iso ]; then
            echo "================================================"
            echo "✅ ISO CREATED SUCCESSFULLY"
            echo "================================================"
            ls -lh JulesOS.iso
            file JulesOS.iso
            echo ""
          else
            echo "================================================"
            echo "❌ ISO CREATION FAILED"
            echo "================================================"
            echo "Debug info:"
            ls -lah iso/ 2>/dev/null || echo "No iso/ directory"
            ls -lah build/ 2>/dev/null || echo "No build/ directory"
            exit 1
          fi

      - name: 📊 Verify ISO Structure
        working-directory: ./jules-os
        run: |
          echo "================================================"
          echo "📊 ISO STRUCTURE VERIFICATION"
          echo "================================================"
          echo ""
          
          if [ -d iso/boot ]; then
            echo "✅ Boot directory found"
            ls -lh iso/boot/
            echo ""
            
            if [ -f iso/boot/bzImage ]; then
              echo "✅ Kernel (bzImage) present"
              file iso/boot/bzImage
            else
              echo "⚠️  Kernel (bzImage) missing"
            fi
            
            if [ -f iso/boot/initrd.img ]; then
              echo "✅ Initrd present"
              file iso/boot/initrd.img
            else
              echo "⚠️  Initrd missing"
            fi
            
            if [ -f iso/boot/syslinux/syslinux.cfg ]; then
              echo "✅ Syslinux configuration found"
            fi
          else
            echo "⚠️  Boot directory not found"
          fi
          echo ""

      - name: 📦 Upload ISO Artifact
        id: upload-iso
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: julesOS-iso
          path: jules-os/JulesOS.iso
          retention-days: 30
          if-no-files-found: warn

      - name: "📤 Fallback: Upload ISO to Release"
        if: steps.upload-iso.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: iso-${{ github.sha }}
          files: jules-os/JulesOS.iso
          name: "Jules OS ISO ${{ github.sha }}"
          body: "ISO artifact uploaded as fallback to GitHub Release (artifact limit exceeded)"

  # ══════════════════════════════════════════════════════
  # SUMMARY JOB: Final Status Report
  # ══════════════════════════════════════════════════════
  summary:
    name: Build Summary
    needs: [ build, test, security, iso ]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📊 Workflow Summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "   ✨ JULES OS BUILD WORKFLOW SUMMARY ✨"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "📋 Job Status:"
          echo "  • Build:     ${{ needs.build.result }}"
          echo "  • Test:      ${{ needs.test.result }}"
          echo "  • Security:  ${{ needs.security.result }}"
          echo "  • ISO:       ${{ needs.iso.result }}"
          echo ""
          
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ Build Job PASSED"
          else
            echo "❌ Build Job FAILED"
          fi
          
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ Test Job PASSED"
          else
            echo "⚠️  Test Job FAILED"
          fi
          
          if [ "${{ needs.security.result }}" = "success" ]; then
            echo "✅ Security Job PASSED"
          else
            echo "⚠️  Security Job FAILED"
          fi
          
          if [ "${{ needs.iso.result }}" = "success" ]; then
            echo "✅ ISO Job PASSED"
          else
            echo "⚠️  ISO Job FAILED"
          fi
          
          echo ""
          if [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.iso.result }}" = "success" ]; then
            echo "════════════════════════════════════════════════════"
            echo "✅ ALL CRITICAL JOBS PASSED! 🎉"
            echo "════════════════════════════════════════════════════"
            echo ""
            echo "Artifacts available in:"
            echo "  📦 Actions → Artifacts"
            echo "  Or fallback to GitHub Releases if limit exceeded"
          else
            echo "════════════════════════════════════════════════════"
            echo "⚠️  CHECK FAILED JOBS ABOVE ⚠️"
            echo "════════════════════════════════════════════════════"
          fi
          echo ""
