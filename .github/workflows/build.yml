name: Jules OS Build, Test & ISO Generation

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build Jules Shell (C++) ──────────────────────────
  build:
    name: Build Jules Shell
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            g++ \
            make \
            wget \
            tar \
            cpio \
            gzip \
            xorriso \
            syslinux \
            syslinux-utils

      - name: 🏗️ Build Jules Shell (CMake)
        working-directory: ./jules-os
        run: |
          echo "========================================="
          echo "🔨 Compiling Jules Shell (C++)"
          echo "========================================="
          mkdir -p build
          cd build
          cmake -DSTATIC_BUILD=ON ..
          make -j$(nproc)
          echo ""
          echo "[✅ OK] Jules Shell compiled successfully"
          file ./julius_shell
          ls -lh ./julius_shell

      - name: 📦 Upload Jules Shell Artifact
        uses: actions/upload-artifact@v4
        with:
          name: julius-shell-binary
          path: julius-os/build/julius_shell
          retention-days: 30

  # ── Run Unit & Component Tests ────────────────────────
  test:
    name: Unit & Component Tests
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make

      - name: 📥 Download Jules Shell
        uses: actions/download-artifact@v4
        with:
          name: julius-shell-binary
          path: ./julius-os/build/

      - name: 🧪 Run Shell Tests
        working-directory: ./julius-os
        run: |
          echo "========================================="
          echo "🧪 Running Component Tests"
          echo "========================================="
          chmod +x build/julius_shell
          
          echo ""
          echo "[TEST] help command..."
          ./build/julius_shell -c "help" > /tmp/help.log 2>&1 && echo "✅ PASS" || echo "⚠️  Check output"
          
          echo "[TEST] clear command..."
          ./build/julius_shell -c "clear" > /dev/null 2>&1 && echo "✅ PASS" || true
          
          echo "[TEST] fetch command..."
          ./build/julius_shell -c "fetch" > /tmp/fetch.log 2>&1 && echo "✅ PASS" || echo "⚠️  Check output"
          
          echo "[TEST] Empty command..."
          OUTPUT=$(./build/julius_shell -c "" 2>&1)
          [ -z "$OUTPUT" ] && echo "✅ PASS" || echo "⚠️  Non-empty output"

      - name: 🔍 Test Build Script Syntax
        run: |
          echo "========================================="
          echo "🔍 Validating Script Syntax"
          echo "========================================="
          bash -n julius-os/scripts/build.sh && echo "✅ build.sh" || exit 1
          sh -n julius-os/scripts/init.sh && echo "✅ init.sh" || exit 1
          bash -n julius-os/scripts/boot.sh && echo "✅ boot.sh" || exit 1

  # ── Build ISO Image ──────────────────────────────────
  iso:
    name: Build ISO Image
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install ISO Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake g++ make wget tar cpio gzip xorriso \
            syslinux syslinux-utils dosfstools mtools qemu-utils

      - name: 📥 Download Jules Shell
        uses: actions/download-artifact@v4
        with:
          name: julius-shell-binary
          path: ./julius-os/build/

      - name: 🏗️ Build ISO Image
        working-directory: ./julius-os
        run: |
          echo "========================================="
          echo "🏗️  Building Jules OS ISO"
          echo "========================================="
          chmod +x build/julius_shell scripts/*.sh
          
          echo "Running ./scripts/build.sh..."
          bash scripts/build.sh
          
          if [ -f JulesOS.iso ]; then
            echo "✅ ISO created successfully!"
            ls -lh JulesOS.iso
            file JulesOS.iso
          else
            echo "❌ ISO creation failed!"
            exit 1
          fi

      - name: 📊 Verify ISO Structure
        working-directory: ./julius-os
        run: |
          echo "========================================="
          echo "📊 ISO Structure Verification"
          echo "========================================="
          [ -d iso/boot ] && echo "✅ Boot directory found" || echo "⚠️  Boot missing"
          [ -f iso/boot/bzImage ] && echo "✅ Kernel found" || echo "⚠️  Kernel missing"
          [ -f iso/boot/initrd.img ] && echo "✅ Initrd found" || echo "⚠️  Initrd missing"

      - name: 📦 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: julesOS-iso
          path: julius-os/JulesOS.iso
          retention-days: 30

  # ── Summary ──────────────────────────────────────────
  summary:
    name: Build Summary
    needs: [ build, test, iso ]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📊 Final Status
        run: |
          echo "════════════════════════════════════════"
          echo "   ✨ Jules OS Build Summary ✨"
          echo "════════════════════════════════════════"
          echo ""
          echo "Build:     ${{ needs.build.result }}"
          echo "Test:      ${{ needs.test.result }}"
          echo "ISO:       ${{ needs.iso.result }}"
          echo ""
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.iso.result }}" = "success" ]; then
            echo "✅ ALL JOBS PASSED! 🎉"
          else
            echo "⚠️  Check logs above"
          fi
