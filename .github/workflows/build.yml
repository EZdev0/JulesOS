
name: Jules OS Build, Test & ISO

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════════════════════════
  # BUILD JOB: Compile Jules Shell (Rust)
  # ══════════════════════════════════════════════════════════════
  build:
    name: Build Jules Shell (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [x86_64, x86, aarch64]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set Architecture Env
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then echo "RUST_TARGET=i686-unknown-linux-musl" >> $GITHUB_ENV;
          elif [ "${{ matrix.arch }}" = "aarch64" ]; then echo "RUST_TARGET=aarch64-unknown-linux-musl" >> $GITHUB_ENV;
          else echo "RUST_TARGET=x86_64-unknown-linux-musl" >> $GITHUB_ENV; fi

      - name: 🦀 Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
          components: clippy, rustfmt

      - name: 🔧 Install musl-tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update && echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/02apt-speedup
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: 📋 Toolchain Info
        run: |
          echo "=== Rust Toolchain ==="
          rustc --version
          cargo --version
          rustup show

      - name: 🔍 Lint (clippy)
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🔍 Running Clippy (Rust Linter)"
          echo "════════════════════════════════════════"
          cargo clippy --all-targets || true

      - name: 📐 Format Check
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "📐 Formatting Code"
          echo "════════════════════════════════════════"
          cargo fmt || true

      - name: 🏗️ Build (Static musl Binary)
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🏗️  BUILDING JULES SHELL (Rust + musl)"
          echo "════════════════════════════════════════"
          RUSTFLAGS="-C strip=symbols" cargo build --release --target ${{ env.RUST_TARGET }}

      - name: 🚨 Deep Diagnostic Mode (Fallback on Failure)
        if: failure()
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🚨 CRITICAL BUILD FAILURE - INITIATING DEEP DIAGNOSTICS"
          echo "════════════════════════════════════════"
          echo "=== 1. Environment & Resources ===" > diagnostic.log
          rustc -vV >> diagnostic.log
          cargo --version >> diagnostic.log
          free -h >> diagnostic.log
          df -h >> diagnostic.log
          echo -e "\n=== 2. Verbose Build Trace (Backtrace) ===" >> diagnostic.log
          RUST_BACKTRACE=full cargo build --verbose --release --target ${{ env.RUST_TARGET }} 2>> diagnostic.log || true
          echo -e "\n=== 3. Deep Linter Audit (Pedantic & Nursery) ===" >> diagnostic.log
          cargo clippy --all-targets -- -W clippy::pedantic -W clippy::nursery -W clippy::unwrap_used 2>> diagnostic.log || true
          echo "Deep diagnostics finished. Zipping results..."
          mkdir -p ../crash_logs
          cp diagnostic.log ../crash_logs/
          cd .. && zip -r JulesOS_CrashLogs.zip crash_logs/

      - name: 📦 Upload Crash Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JulesOS_CrashLogs_BuildPhase
          path: JulesOS_CrashLogs.zip

      - name: 🔍 Post-Build Verification
        if: success()
        working-directory: ./jules-os
        run: |
          echo ""
          echo "✅ Jules Shell compiled successfully"
          echo ""
          echo "Binary Information:"
          file target/${{ env.RUST_TARGET }}/release/jules_shell
          ls -lh target/${{ env.RUST_TARGET }}/release/jules_shell
          echo ""

          # Verify it's statically linked
          file target/${{ env.RUST_TARGET }}/release/jules_shell | grep -i "static" && \
            echo "✅ Binary is statically linked" || \
            echo "⚠️  Binary may be dynamically linked"

          # Quick smoke test
          target/${{ env.RUST_TARGET }}/release/jules_shell -c "help" | head -5

      - name: 📦 Upload Jules Shell Binary
        id: upload-binary
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jules-shell-binary-${{ matrix.arch }}
          path: jules-os/target/${{ env.RUST_TARGET }}/release/jules_shell
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # TEST JOB: Unit Tests & Component Tests
  # ══════════════════════════════════════════════════════════════
  test:
    name: Unit Tests (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [x86_64, x86, aarch64]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set Architecture Env
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then echo "RUST_TARGET=i686-unknown-linux-musl" >> $GITHUB_ENV;
          elif [ "${{ matrix.arch }}" = "aarch64" ]; then echo "RUST_TARGET=aarch64-unknown-linux-musl" >> $GITHUB_ENV;
          else echo "RUST_TARGET=x86_64-unknown-linux-musl" >> $GITHUB_ENV; fi

      - name: 🦀 Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: 🔧 Install musl-tools
        run: sudo rm -f /var/lib/man-db/auto-update && echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/02apt-speedup && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: 🧪 Run Unit Tests
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🧪 RUNNING UNIT TESTS"
          echo "════════════════════════════════════════"
          cargo test --release -- --test-threads=1
          echo ""
          echo "✅ All unit tests passed"

      - name: 🧪 Component Tests
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🧪 COMPONENT TESTS"
          echo "════════════════════════════════════════"

          # Build the binary for component tests
          cargo build --release --target ${{ env.RUST_TARGET }}
          BINARY="target/${{ env.RUST_TARGET }}/release/jules_shell"
          chmod +x "$BINARY"

          PASS=0
          FAIL=0

          # Test 1: help command
          echo "[TEST 1/6] Testing 'help' command..."
          if $BINARY -c "help" > /dev/null 2>&1; then
            echo "✅ PASS: help command"
            PASS=$((PASS+1))
          else
            echo "❌ FAIL: help command"
            FAIL=$((FAIL+1))
          fi

          # Test 2: clear command
          echo "[TEST 2/6] Testing 'clear' command..."
          if $BINARY -c "clear" > /dev/null 2>&1; then
            echo "✅ PASS: clear command"
            PASS=$((PASS+1))
          else
            echo "❌ FAIL: clear command"
            FAIL=$((FAIL+1))
          fi

          # Test 3: fetch command
          echo "[TEST 3/6] Testing 'fetch' command..."
          if $BINARY -c "fetch" > /dev/null 2>&1; then
            echo "✅ PASS: fetch command"
            PASS=$((PASS+1))
          else
            echo "⚠️  fetch (non-critical)"
            PASS=$((PASS+1))
          fi

          # Test 4: Empty command
          echo "[TEST 4/6] Testing empty command..."
          OUTPUT=$($BINARY -c "" 2>&1 || true)
          if [ -z "$OUTPUT" ]; then
            echo "✅ PASS: Empty command handled correctly"
            PASS=$((PASS+1))
          else
            echo "⚠️  Empty command produced output (non-critical)"
            PASS=$((PASS+1))
          fi

          # Test 5: Whitespace command
          echo "[TEST 5/6] Testing whitespace command..."
          OUTPUT=$($BINARY -c "   " 2>&1 || true)
          if [ -z "$OUTPUT" ]; then
            echo "✅ PASS: Whitespace command handled correctly"
            PASS=$((PASS+1))
          else
            echo "⚠️  Whitespace produced output (non-critical)"
            PASS=$((PASS+1))
          fi

          # Test 6: Exit code
          echo "[TEST 6/6] Testing exit code..."
          if $BINARY -c "help" > /dev/null 2>&1; then
            echo "✅ PASS: Exit code 0"
            PASS=$((PASS+1))
          else
            echo "❌ FAIL: Non-zero exit code"
            FAIL=$((FAIL+1))
          fi

          echo ""
          echo "════════════════════════════════════════"
          echo "📊 TEST RESULTS: $PASS passed, $FAIL failed"
          echo "════════════════════════════════════════"

          if [ $FAIL -gt 0 ]; then exit 1; fi

      - name: 🔍 Script Syntax Validation
        run: |
          echo "════════════════════════════════════════"
          echo "🔍 SCRIPT SYNTAX VALIDATION"
          echo "════════════════════════════════════════"

          echo "[CHECK] build.sh syntax..."
          bash -n jules-os/scripts/build.sh && echo "✅ build.sh valid"

          echo "[CHECK] init.sh syntax..."
          sh -n jules-os/scripts/init.sh && echo "✅ init.sh valid"

          echo "[CHECK] boot.sh syntax..."
          bash -n jules-os/scripts/boot.sh && echo "✅ boot.sh valid"

  # ══════════════════════════════════════════════════════════════
  # SECURITY JOB: Rust-native Security Analysis
  # ══════════════════════════════════════════════════════════════
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🔒 Dependency Audit (cargo-audit)
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🔒 DEPENDENCY SECURITY AUDIT"
          echo "════════════════════════════════════════"
          cargo install cargo-audit 2>/dev/null || true
          cargo audit || echo "⚠️  Some advisories found (review above)"

      - name: 🔍 Clippy (Strict Mode)
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🔍 CLIPPY STRICT MODE"
          echo "════════════════════════════════════════"
          cargo clippy --all-targets -- \
            -W warnings \
            -W clippy::all \
            -W clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_precision_loss || true

      - name: 🐍 Setup Python Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/tests/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 🔒 Install Security Tools (shellcheck, pip)
        run: |
          sudo rm -f /var/lib/man-db/auto-update && echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/02apt-speedup
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends shellcheck python3-pip
          pip3 install --break-system-packages flake8 bandit
          
      - name: 🔒 Run Shellcheck
        run: |
          shellcheck -x jules-os/scripts/*.sh || true
          echo "✅ Shell script analysis complete"

      - name: 🐍 Run Python Linters (flake8, bandit)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Running Flake8..."
          flake8 jules-os/tests/ || true
          echo "Running Bandit..."
          bandit -r jules-os/tests/ -ll -ii || true

      - name: 🛡️ Trivy OS Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'jules-os/'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════
  # ISO BUILD JOB: Generate Bootable ISO
  # ══════════════════════════════════════════════════════════════
  iso:
    name: Build ISO (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [x86_64, x86, aarch64]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install ISO Build Dependencies
        run: |
          sudo rm -f /var/lib/man-db/auto-update && echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/02apt-speedup
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            wget tar cpio gzip xorriso pv \
            syslinux syslinux-utils dosfstools mtools qemu-utils qemu-system-x86 \
            grub-pc-bin grub-efi-amd64-bin

      - name: 📥 Download Jules Shell Binary
        uses: actions/download-artifact@v4
        with:
          name: jules-shell-binary-${{ matrix.arch }}
          path: ./jules-os/build/

      - name: 🏗️ Build ISO Image
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🏗️  BUILDING ISO IMAGE"
          echo "════════════════════════════════════════"

          chmod +x build/jules_shell
          chmod +x scripts/*.sh

          echo "Pre-build checks:"
          ls -lh build/jules_shell
          file build/jules_shell

          echo ""
          echo "Running build.sh ${{ matrix.arch }}..."
          bash scripts/build.sh ${{ matrix.arch }}

          echo ""
          if [ -f JulesOS-${{ matrix.arch }}.iso ]; then
            echo "════════════════════════════════════════"
            echo "✅ ISO CREATED SUCCESSFULLY"
            echo "════════════════════════════════════════"
            ls -lh JulesOS-${{ matrix.arch }}.iso
            file JulesOS-${{ matrix.arch }}.iso
          else
            echo "════════════════════════════════════════"
            echo "❌ ISO CREATION FAILED"
            echo "════════════════════════════════════════"
            ls -lah iso/ 2>/dev/null || echo "No iso/ directory"
            exit 1
          fi

      - name: 📊 Verify ISO Structure
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "📊 ISO STRUCTURE VERIFICATION"
          echo "════════════════════════════════════════"

          if [ -d iso/boot ]; then
            echo "✅ Boot directory found"
            ls -lh iso/boot/

            [ -f iso/boot/bzImage ] && echo "✅ Kernel (bzImage) present" || echo "⚠️  Kernel missing"
            [ -f iso/boot/initrd.img ] && echo "✅ Initrd present" || echo "⚠️  Initrd missing"
            [ -f iso/boot/syslinux/syslinux.cfg ] && echo "✅ Syslinux config present"
            [ -f iso/boot/grub/grub.cfg ] && echo "✅ GRUB config present"
          fi

      - name: "🤖 Sub-Agent QEMU Boot Validation"
        working-directory: ./jules-os
        run: |
          echo "════════════════════════════════════════"
          echo "🤖 SUB-AGENT: BOOT VALIDATION"
          echo "════════════════════════════════════════"
          # Requires python3 to run the automated test agent
          python3 tests/qemu_boot_test.py

      - name: 📦 Upload ISO Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: julesOS-iso-${{ matrix.arch }}
          path: jules-os/JulesOS-${{ matrix.arch }}.iso
          retention-days: 30

      - name: 📁 Save Crash Logs on Failure
        if: failure()
        run: |
          echo "Workflow failed. Zipping up available logs..."
          mkdir -p crash_logs
          dmesg > crash_logs/syslog.log 2>/dev/null || true
          cp -r jules-os/logs crash_logs/ 2>/dev/null || true
          zip -r JulesOS_CrashLogs.zip crash_logs/
        
      - name: 📦 Upload Crash Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JulesOS_CrashLogs
          path: JulesOS_CrashLogs.zip

  # ══════════════════════════════════════════════════════════════
  # ANALYSIS JOB: Deep OS Image Analysis
  # ══════════════════════════════════════════════════════════════
  iso-analysis:
    name: ISO Analysis (${{ matrix.arch }})
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [x86_64, x86, aarch64]

    steps:
      - name: 📥 Download ISO Artifact
        uses: actions/download-artifact@v4
        with:
          name: julesOS-iso-${{ matrix.arch }}
          path: ./

      - name: 🔧 Install Analysis Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends binwalk tree fdisk p7zip-full

      - name: 🔬 Analyze ISO Image
        run: |
          echo "════════════════════════════════════════"
          echo "🔬 DEEP OS IMAGE ANALYSIS"
          echo "════════════════════════════════════════"
          
          REPORT="os-analysis-report.txt"
          echo "=== JULES OS - IMAGE ANALYSIS REPORT ===" > $REPORT
          echo "Date: $(date)" >> $REPORT
          echo "" >> $REPORT

          echo "1. File Size & Type:" >> $REPORT
          ls -lh JulesOS-${{ matrix.arch }}.iso >> $REPORT
          file JulesOS-${{ matrix.arch }}.iso >> $REPORT
          echo "" >> $REPORT

          echo "2. Partition Table (fdisk):" >> $REPORT
          fdisk -l JulesOS-${{ matrix.arch }}.iso >> $REPORT
          echo "" >> $REPORT

          echo "3. Binwalk Signature Scan (Finding hidden embedded data):" >> $REPORT
          binwalk JulesOS-${{ matrix.arch }}.iso >> $REPORT
          echo "" >> $REPORT

          echo "4. Extracting ISO Contents for Tree View..." >> $REPORT
          7z x JulesOS-${{ matrix.arch }}.iso -oextracted_iso > /dev/null 2>&1
          
          echo "5. ISO Directory Structure:" >> $REPORT
          tree extracted_iso >> $REPORT
          
          echo "Analysis complete. Report generated."
          cat $REPORT

      - name: 📦 Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: julesOS-analysis-report-${{ matrix.arch }}
          path: os-analysis-report.txt
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # SUMMARY JOB: Final Status Report
  # ══════════════════════════════════════════════════════════════
  summary:
    name: Build Summary
    needs: [ build, test, security, iso, iso-analysis ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: 📊 Workflow Summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "   ✨ JULES OS BUILD WORKFLOW SUMMARY ✨"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "📋 Job Status:"
          echo "  • Build (Rust):  ${{ needs.build.result }}"
          echo "  • Test:          ${{ needs.test.result }}"
          echo "  • Security:      ${{ needs.security.result }}"
          echo "  • ISO:           ${{ needs.iso.result }}"
          echo "  • ISO-Analysis:  ${{ needs.iso-analysis.result }}"
          echo ""

          CRITICAL_OK=true
          [ "${{ needs.build.result }}" = "success" ] && echo "✅ Build PASSED" || { echo "❌ Build FAILED"; CRITICAL_OK=false; }
          [ "${{ needs.test.result }}" = "success" ] && echo "✅ Tests PASSED" || { echo "⚠️  Tests FAILED"; CRITICAL_OK=false; }
          [ "${{ needs.security.result }}" = "success" ] && echo "✅ Security PASSED" || echo "⚠️  Security FAILED"
          [ "${{ needs.iso.result }}" = "success" ] && echo "✅ ISO PASSED" || { echo "⚠️  ISO FAILED"; CRITICAL_OK=false; }
          [ "${{ needs.iso-analysis.result }}" = "success" ] && echo "✅ Analysis PASSED" || echo "⚠️  Analysis FAILED"

          echo ""
          if $CRITICAL_OK; then
            echo "════════════════════════════════════════════════════"
            echo "✅ ALL CRITICAL JOBS PASSED! 🎉"
            echo "════════════════════════════════════════════════════"
          else
            echo "════════════════════════════════════════════════════"
            echo "⚠️  CHECK FAILED JOBS ABOVE ⚠️"
            echo "════════════════════════════════════════════════════"
          fi

  # ══════════════════════════════════════════════════════════════
  # RELEASE JOB: Auto-Generate Github Release
  # ══════════════════════════════════════════════════════════════
  release:
    name: Generate Release
    needs: [ build, test, security, iso, iso-analysis, summary ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: 📝 Determine Release Status
        id: status
        run: |
          echo "TITLE=✅ JulesOS Stable Update v1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "BODY=## ✅ Automated JulesOS Release\nThis release was successfully generated by the JulesOS Build Pipeline.\n\n**Included Assets:**\n- \`JulesOS.iso\` (The bootable hybrid ISO)\n- \`jules_shell\` (The compiled native Rust binary core)\n- Security analysis reports" >> $GITHUB_ENV

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: 📦 Prepare Release Files
        run: |
          mkdir -p release_assets
          # Move all downloaded artifacts (if any exist) into the release folder
          find artifacts/ -type f -exec mv {} release_assets/ \; || true
          echo "Files ready for release:"
          ls -lh release_assets/ || true

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ${{ env.TITLE }}
          body: ${{ env.BODY }}
          files: release_assets/*
